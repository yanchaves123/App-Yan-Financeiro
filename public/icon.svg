<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#1e293b" stroke-width="4" fill="none" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="168" fill="url(#emeraldGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Shield / Emblem Container -->
  <circle cx="256" cy="256" r="150" fill="url(#emeraldGrad)" />

  <!-- Inner Dark Ring Accent -->
  <circle cx="256" cy="256" r="136" fill="#090d16" fill-opacity="0.25" />

  <!-- Monogram "Y" -->
  <path d="M180 160 L240 252 L240 352 Q240 360 256 360 Q272 360 272 352 L272 252 L332 160 Q338 150 326 150 L296 150 Q286 150 280 160 L256 206 L232 160 Q226 150 216 150 L186 150 Q174 150 180 160 Z" fill="#ffffff" />

  <!-- Little Sparkle / Star on Top Right of Emblem -->
  <path d="M340 160 Q355 160 355 145 Q355 160 370 160 Q355 160 355 175 Q355 160 340 160 Z" fill="url(#goldGrad)" />
</svg>
